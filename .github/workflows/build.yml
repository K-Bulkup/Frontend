name: Frontend CI/CD with Vue

# 해당 워크플로우를 언제 실행할지 결정하는 조건
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["develop"] # 🆕 추가

# 실행할 작업
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build Docker image
        run: |
          echo "🧹 Cleaning Docker system..."
          docker system prune -af  # 🆕 추가
          echo "🏗️ Building optimized image..."
          docker build --no-cache -t kbulkup-vue:latest --platform linux/amd64 .
          echo "Docker image built successfully"
          docker images | grep kbulkup-vue

      - name: Save Docker image to tar
        run: |
          echo "📦 Saving and compressing Docker image..."
          docker save kbulkup-vue:latest | gzip > kbulkup-vue.tar.gz  # 🆕 압축
          echo "Docker image saved and compressed"
          chmod 644 kbulkup-vue.tar.gz  # 🆕 파일명 변경
          ls -lh kbulkup-vue.tar.gz  # 🆕 파일명 변경

      - name: Prepare deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.201.172.152
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            cd /home/ec2-user/frontend
            sudo docker-compose down || true
            rm -f /home/ec2-user/frontend/kbulkup-vue.tar*  # 🆕 패턴 변경
            sudo docker image prune -f

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.201.172.152
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "/home/ec2-user/frontend/"

      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.201.172.152
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "kbulkup-vue.tar.gz" # 🆕 파일명 변경
          target: "/home/ec2-user/frontend/"

      - name: Load image and start with docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.201.172.152
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            echo "Loading compressed Docker image..."
            sudo docker load < /home/ec2-user/frontend/kbulkup-vue.tar.gz  # 🆕 압축 로드

            echo "Loaded images:"
            sudo docker images | grep kbulkup-vue

            echo "Starting services with docker-compose..."
            cd /home/ec2-user/frontend
            sudo docker-compose up -d

            echo "Waiting for services to start..."
            sleep 15

            echo "=== Container Status ==="
            sudo docker ps | grep kbulkup-vue

            echo "=== Container Logs ==="
            sudo docker logs --tail=20 kbulkup-vue

            # Vue 애플리케이션 헬스체크
            timeout 60 bash -c 'until curl -f http://localhost:80/ 2>/dev/null; do 
              echo "Waiting for Vue application..."
              sleep 5
            done && echo "✅ Vue application is healthy!" || echo "❌ Vue application health check failed"'

            # SPA 라우팅 테스트
            echo "=== Testing SPA routing ==="
            if curl -f http://localhost:80/login 2>/dev/null; then
              echo "✅ SPA routing is working!"
            else
              echo "❌ SPA routing test failed"
              echo "Checking container logs for SPA issues..."
              sudo docker logs --tail=10 kbulkup-vue
            fi

            rm -f /home/ec2-user/frontend/kbulkup-vue.tar.gz  # 🆕 파일명 변경
            echo "Frontend deployment completed successfully!"

      - name: Final verification
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.201.172.152
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            echo "🔍 Final system status..."
            echo "=== Running containers ==="
            sudo docker ps

            echo "=== Port status ==="
            sudo netstat -tlnp | grep :80

            echo "=== Memory usage ==="
            free -h

            echo "=== Disk usage ==="
            df -h /

            echo "=== Application response test ==="
            curl -I http://localhost:80/ || echo "Main page test failed"

            echo "🎉 Frontend deployment verification completed!"
