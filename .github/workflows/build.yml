name: Frontend Deploy with Compose

on:
  pull_request:
    branches: ["develop"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and save image
        run: |
          docker build -t kbulkup-vue:latest .
          docker save -o kbulkup-vue.tar kbulkup-vue:latest
          chmod 644 kbulkup-vue.tar

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.201.172.152
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "kbulkup-vue.tar,docker-compose.yml"
          target: "/home/ec2-user/frontend/"

      - name: Deploy with docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.201.172.152
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/frontend

            echo "🔄 Stopping existing services..."
            sudo docker-compose down --remove-orphans || true

            echo "🧹 Cleaning up old images..."
            # 사용하지 않는 이미지 정리 (dangling images)
            sudo docker image prune -f || true

            echo "📦 Loading new Docker image..."
            sudo docker load -i kbulkup-vue.tar

            echo "🚀 Starting services..."
            sudo docker-compose up -d

            echo "✅ Checking deployment status..."
            sudo docker-compose ps

            echo "📊 Container logs (last 10 lines)..."
            sudo docker-compose logs --tail=10 vue-app || true

            echo "🗑️ Cleaning up..."
            rm -f kbulkup-vue.tar

            echo "🎉 Frontend deployed successfully!"
