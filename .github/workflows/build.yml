name: Frontend Deploy with Compose

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build and save image
        run: |
          docker build -t kbulkup-vue:latest .
          docker save -o kbulkup-vue.tar kbulkup-vue:latest
          chmod 644 kbulkup-vue.tar

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.201.172.152
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "kbulkup-vue.tar,docker-compose.yml"
          target: "/home/ec2-user/frontend/"

      - name: Deploy with docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.201.172.152
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/frontend

            # 기존 서비스 정지
            sudo docker-compose down || true

            # 이미지 로드
            sudo docker load -i kbulkup-vue.tar

            # 서비스 시작
            sudo docker-compose up -d

            echo "✅ Frontend deployed with docker-compose!"
            rm -f kbulkup-vue.tar
