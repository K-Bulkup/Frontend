name: Frontend Deploy with Compose

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and save image
        run: |
          docker build --no-cache -t kbulkup-vue:latest .
          docker save -o kbulkup-vue.tar kbulkup-vue:latest
          chmod 644 kbulkup-vue.tar

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.201.172.152
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "kbulkup-vue.tar,docker-compose.yml"
          target: "/home/ec2-user/frontend/"

      - name: Deploy with docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.201.172.152
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/frontend

            echo "📊 Before deployment - System status..."
            echo "Memory usage:"
            free -h
            echo "Disk usage:"
            df -h
            echo "Running containers:"
            sudo docker ps
            echo "Port 80 usage:"
            sudo netstat -tlnp | grep :80 || echo "Port 80 is free"

            echo "🔄 Stopping existing services..."
            if ! sudo docker-compose down --remove-orphans; then
              echo "⚠️ Warning: Failed to stop existing services, continuing..."
            fi

            echo "🧹 Cleaning up old images and containers..."
            # 중지된 컨테이너 제거
            sudo docker container prune -f
            # dangling 이미지 제거
            sudo docker image prune -f
            # 사용하지 않는 볼륨 제거
            sudo docker volume prune -f
            # 사용하지 않는 네트워크 제거
            sudo docker network prune -f

            echo "💾 Checking disk space..."
            df -h /

            echo "📦 Loading new Docker image..."
            if sudo docker load -i kbulkup-vue.tar; then
              echo "✅ Image loaded successfully"
            else
              echo "❌ Failed to load Docker image"
              exit 1
            fi

            echo "🚀 Starting services..."
            if sudo docker-compose up -d; then
              echo "✅ Services started successfully"
            else
              echo "❌ Failed to start services"
              exit 1
            fi

            echo "⏳ Waiting for services to be ready..."
            sleep 10

            echo "📊 Checking deployment status..."
            sudo docker-compose ps

            # 서비스 헬스체크
            if sudo docker-compose ps | grep -q "Up"; then
              echo "✅ Services are running"
            else
              echo "❌ Services are not running properly"
              sudo docker-compose logs
              exit 1
            fi

            echo "📋 Container logs (last 20 lines)..."
            sudo docker-compose logs --tail=20 vue-app

            echo "🗑️ Cleaning up temporary files..."
            rm -f kbulkup-vue.tar

            echo "💾 Final disk space check..."
            df -h /

            echo "🎉 Frontend deployed successfully!"

            echo "📊 After deployment - System status..."
            echo "Memory usage:"
            free -h
            echo "Running containers:"
            sudo docker ps
            echo "Container resource usage:"
            sudo docker stats --no-stream

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.201.172.152
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🔍 Debugging network connectivity..."

            # 포트 리스닝 상태 확인
            echo "Ports listening on 3000:"
            sudo netstat -tlnp | grep :3000

            # 컨테이너 상세 정보
            echo "Container details:"
            sudo docker inspect kbulkup-vue | grep -A5 -B5 "PortBindings\|NetworkMode\|IPAddress"

            # 컨테이너 로그 확인
            echo "Container logs:"
            sudo docker logs --tail=30 kbulkup-vue

            # 로컬 접근 테스트
            echo "Testing local access on port 80 (mapped port):"
            curl -v -m 10 http://localhost:80 || echo "Port 80 access failed"

            echo "Testing local access on port 8080 (container internal port):"
            sudo docker exec -it kbulkup-vue curl -m 5 http://localhost:8080 2>/dev/null || echo "Container internal port 8080 test failed"

            # 실제 애플리케이션 응답 확인
            if curl -f http://localhost:80 > /dev/null 2>&1; then
              echo "✅ Application is responding on port 80"
            else
              echo "❌ Application is not responding on port 80"
              echo "Checking if container is actually running..."
              sudo docker ps | grep kbulkup-vue
            fi
